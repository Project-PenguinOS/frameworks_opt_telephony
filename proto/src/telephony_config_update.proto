syntax = "proto2";
package com.android.internal.telephony.satellite;

option java_package = "com.android.internal.telephony.satellite";
option java_outer_classname = "SatelliteConfigData";

// Top level container for all telephony configs that can be updated.
//
// satellite:
//   Configuration for satellite related configs.
//
// data:
//   Configuration for data related configs.
message TelephonyConfigProto {
  optional SatelliteConfigProto satellite = 1;
  optional DataConfigProto data = 2;
}

// 1. Container for all satellite-related configs that can be dynamically updated.
//
// version:
//   The version of this configuration file. Used to prevent applying older
//   configs.
//
// carrier_supported_satellite_services:
//   List of carriers and their supported satellite services.
//
// device_satellite_region:
//   The satellite region of the device.
//
// carrier_roaming_config:
//   The carrier roaming config of the device.
//
message SatelliteConfigProto {
  optional int32 version = 1;
  repeated CarrierSupportedSatelliteServicesProto carrier_supported_satellite_services = 2;
  optional SatelliteRegionProto device_satellite_region = 3;
  optional CarrierRoamingConfigProto carrier_roaming_config = 4;
}

message CarrierRoamingConfigProto {
  optional int32 max_allowed_data_mode = 1;
  repeated string device_satellite_plmn = 2;
}

message CarrierSupportedSatelliteServicesProto {
  optional int32 carrier_id = 1;
  repeated SatelliteProviderCapabilityProto supported_satellite_provider_capabilities = 2;
}

message SatelliteProviderCapabilityProto{
  optional string carrier_plmn = 1;
  repeated int32 allowed_services = 2;
}

message SatelliteRegionProto {
  optional bytes s2_cell_file = 1;
  repeated string country_codes = 2;
  optional bool is_allowed = 3;
  optional bytes satellite_access_config_file = 4;
}

// 2. Container for all data-related configs that can be dynamically updated.
//
// version:
//   The version of this configuration file. Used to prevent applying older
//   configs.
//
// connection_capability_configs:
//   Maps NetworkCapability to ConnectionCapability.
//
// home_metered_capability_configs:
//   List of capabilities treated as metered on home network.
//
// roam_metered_capability_configs:
//   List of capabilities treated as metered on roaming network.
//
message DataConfigProto {
  optional int32 version = 1;
  optional ConnectionCapabilityConfig connection_capability_configs = 2;
  optional MeteredCapabilityConfig home_metered_capability_configs = 3;
  optional MeteredCapabilityConfig roam_metered_capability_configs = 4;
}

// Configuration wrapper for Connection Capability mapping rules.
// Contains both default rules and carrier-specific overrides.
//
// default_connection_capability_config:
//   Default mapping rules applied to all carriers.
//   The 'carrier_id' field inside this message is ignored.
//
// carrier_connection_capability_configs:
//   List of carrier-specific mapping rules.
//   The 'carrier_id' field inside each message acts as the key and is required.
message ConnectionCapabilityConfig {
  optional ConnectionCapabilityMap default_connection_capability_config = 1;
  repeated ConnectionCapabilityMap carrier_connection_capability_configs = 2;
}

// Defines the mapping rules between NetworkCapability and ConnectionCapability.
// Reused for both default (no carrier_id) and carrier-specific (with
// carrier_id) configs.
//
// carrier_id:
//   The Android Canonical Carrier ID.
//   - Required when used in 'carrier_connection_capability_configs'.
//   - Ignored when used in 'default_connection_capability_config'.
//
// rules:
//   List of mapping rule strings.
//   Format: "NetworkCapability:ConnectionCapability:ApnRequired"
//   Example: "12:8:true" (NET_CAPABILITY_INTERNET -> CONNECTION_CAPABILITY_INTERNET)
message ConnectionCapabilityMap {
  optional int32 carrier_id = 1;
  repeated string rules = 2;
}

// Configuration wrapper for Metered Capabilities.
// Contains both default rules and carrier-specific overrides.
//
// default_metered_capability_config:
//   Default metered capabilities applied to all carriers.
//   The 'carrier_id' field inside this message is ignored.
//
// carrier_metered_capability_configs:
//   List of carrier-specific metered capabilities.
//   The 'carrier_id' field inside each message acts as the key and is required.
message MeteredCapabilityConfig {
  optional MeteredCapabilities default_metered_capability_config = 1;
  repeated MeteredCapabilities carrier_metered_capability_configs = 2;
}

// Defines the set of metered network capabilities for a single carrier.
// Reused for both default (no carrier_id) and carrier-specific (with
// carrier_id) configs.
//
// carrier_id:
//   The Android Canonical Carrier ID.
//   - Required when used in 'carrier_metered_capability_configs'.
//   - Ignored when used in 'default_metered_capability_config'.
//
// capability_ids:
//   List of NetworkCapability constants treated as metered.
//   Example: 12 for NET_CAPABILITY_INTERNET.
message MeteredCapabilities {
  optional int32 carrier_id = 1;
  repeated int32 capability_ids = 2;
}

